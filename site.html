<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHub - Produtividade</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>TaskHub</span>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-btn active" data-filter="all">
                    <i class="fa-solid fa-list-check"></i> Todas as Tarefas
                </button>
                <button class="nav-btn" data-filter="Trabalho">
                    <i class="fa-solid fa-briefcase"></i> Trabalho
                </button>
                <button class="nav-btn" data-filter="Estudos">
                    <i class="fa-solid fa-graduation-cap"></i> Estudos
                </button>
                <button class="nav-btn" data-filter="Pessoal">
                    <i class="fa-solid fa-user"></i> Pessoal
                </button>
            </nav>

            <div class="theme-toggle">
                <button id="themeToggleBtn">
                    <i class="fa-solid fa-moon"></i> <span>Modo Escuro</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Minhas Tarefas</h1>
                    <p id="currentDate">Carregando data...</p>
                </div>
                <div class="stats-card">
                    <span id="taskProgressText">0 de 0 concluídas</span>
                    <div class="progress-bar">
                        <div id="progressBarFill" class="progress-fill"></div>
                    </div>
                </div>
            </header>

            <!-- Formulário de Adição -->
            <section class="task-form-section">
                <form id="taskForm">
                    <input type="text" id="taskInput" placeholder="O que você tem que fazer." required autocomplete="off">
                    <select id="taskCategory">
                        <option value="Trabalho">Trabalho</option>
                        <option value="Estudos">Estudos</option>
                        <option value="Pessoal">Pessoal</option>
                    </select>
                    <button type="submit" id="addBtn">
                        <i class="fa-solid fa-plus"></i> Adicionar
                    </button>
                </form>
            </section>

            <!-- Lista de Tarefas -->
            <section class="tasks-section">
                <div class="tasks-toolbar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Pesquisar tarefas...">
                    </div>
                    <button id="clearCompletedBtn">Limpar Concluídas</button>
                </div>

                <ul id="taskList" class="task-list">
                    <!-- As tarefas entram aqui via JavaScript -->
                </ul>

                <div id="emptyState" class="empty-state hidden">
                    <i class="fa-solid fa-clipboard-question"></i>
                    <p>Nenhuma tarefa encontrada.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
